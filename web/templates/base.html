<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IIDS | Intelligent Intrusion Detection System{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Custom Cyber Dark Theme CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-dark-mesh text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-surface border-bottom border-dark-subtle sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
                <span class="brand-icon"><i class="fa-solid fa-shield-halved text-cyan"></i></span>
                <span class="tracking-wide">IIDS <span class="badge bg-cyan-subtle text-cyan fs-7 fw-semibold">ENGINE</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="fa-solid fa-chart-line me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/monitor' %}active{% endif %}" href="/monitor">
                            <i class="fa-solid fa-radar me-1"></i> Live Monitor
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/analyze' %}active{% endif %}" href="/analyze">
                            <i class="fa-solid fa-file-waveform me-1"></i> Flow Analyzer
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/firewall' %}active{% endif %}" href="/firewall">
                            <i class="fa-solid fa-fire-burner me-1"></i> Firewall Quarantine
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <span class="status-indicator d-flex align-items-center gap-2 text-muted fs-7">
                        <span class="pulse-dot bg-emerald"></span> System Active
                    </span>
                    <a href="/export/threats.csv" class="btn btn-sm btn-outline-cyan">
                        <i class="fa-solid fa-file-arrow-down me-1"></i> Export Logs
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer border-top border-dark-subtle py-3 mt-5">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center text-muted fs-7">
            <div>Intelligent Intrusion Detection System &bull; Machine Learning & Stateful Heuristics</div>
            <div><i class="fa-solid fa-lock text-cyan me-1"></i> Enterprise Threat Protection</div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
